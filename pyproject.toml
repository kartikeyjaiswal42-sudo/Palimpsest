[project]
name = "palimpsest"
version = "0.1.0"
description = "A white-box AI-text detector for college admissions essays: shows where, and shows why."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # The instrument: a small local causal LM read for token probabilities.
    "torch>=2.4",
    "transformers>=4.44",
    # Numerics + the interpretable classifier / calibration / metrics.
    "numpy>=1.26",
    "scikit-learn>=1.5",
    # HTTP API.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
data = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
palimpsest = "palimpsest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs the local language model (downloads weights on first run)",
]
